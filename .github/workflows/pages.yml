# Сайт на GitHub Pages: https://beautybrand-uz.github.io/ (и старый адрес malik-alaska2.github.io/beautybrand/)
name: Deploy shop to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["shop/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shop/package-lock.json
      - run: npm ci
      # proxy.ts (редирект на язык) не работает в статическом экспорте — его заменяет index.html ниже
      - run: rm -f src/proxy.ts
      - run: npm run build
        env:
          # в репозитории beautybrand-uz.github.io сайт открывается с корня, в остальных — с /<имя репозитория>
          GITHUB_PAGES: ${{ endsWith(github.event.repository.name, '.github.io') && '0' || '1' }}
          STATIC_EXPORT: "1"
          # ключи Supabase для отзывов (Settings → Secrets and variables → Actions); без них отзывы уходят в Telegram
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Redirect root to language
        run: |
          touch out/.nojekyll
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8">
          <title>BeautyBrand Uz</title>
          <meta http-equiv="refresh" content="0; url=./ru/">
          <script>location.replace((navigator.language || "").toLowerCase().startsWith("uz") ? "./uz/" : "./ru/");</script>
          </head><body><a href="./ru/">BeautyBrand Uz</a></body></html>
          HTML
      # публикация веткой gh-pages (Pages → Deploy from a branch → gh-pages)
      - name: Publish to gh-pages
        working-directory: shop/out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Сайт: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
